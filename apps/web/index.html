<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starship Catch Simulator</title>
    <meta
      name="description"
      content="A real-time 6-DOF browser simulation of SpaceX's Super Heavy booster catch — PID, convex MPC, and an imitation-learned neural policy on one physics core. No single controller wins: the neural policy owns the calm corner (96%) while convex MPC is the wind-robust generalist, measured on a held-out, domain-randomized benchmark. Fly it by hand or pit the controllers against each other."
    />
    <meta name="theme-color" content="#0b2a52" />

    <!-- Favicons. %BASE_URL% resolves to the Vite base ("/" locally,
         "/starship-catch-sim/" on Pages). The explicit icon links also stop
         the browser's implicit /favicon.ico probe (was a 404 — SLS-95). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Open Graph / Twitter. Temporary front-door art (SLS-95): the honest
         progression card (docs/media/progression.svg) rendered to PNG. Swap in
         a hero catch still when SLS-64 / SLS-33 land, and set it as the repo
         social preview then. og:image must be an ABSOLUTE URL for scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starship Catch Simulator" />
    <meta property="og:url" content="https://dionismuzenitov.github.io/starship-catch-sim/" />
    <meta property="og:title" content="Starship Catch Simulator — PID vs MPC vs a neural policy, in your browser" />
    <meta
      property="og:description"
      content="Open-source 6-DOF sim of the Super Heavy catch. No single controller wins — an imitation-learned neural policy owns the calm corner (96%); convex MPC is the wind-robust generalist. PID / MPC / neural on one physics core, on a held-out benchmark."
    />
    <meta property="og:image" content="https://dionismuzenitov.github.io/starship-catch-sim/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Booster catch rate by controller generation — PID 0%, convex MPC 49/37/39%, neural policy 96/59/36% (calm/standard/stormy) on held-out acceptance seeds." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starship Catch Simulator" />
    <meta
      name="twitter:description"
      content="Open-source 6-DOF sim of SpaceX's Super Heavy catch. No single controller wins: a neural policy owns the calm corner (96%), convex MPC is the wind-robust generalist — on a held-out benchmark, all in your browser."
    />
    <meta name="twitter:image" content="https://dionismuzenitov.github.io/starship-catch-sim/og-image.png" />
  </head>
  <body class="m-0 h-screen w-screen overflow-hidden bg-black">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
