<!doctype html>
<!--
  Source template for apps/web/public/og-image.png (1200×630, the social-share
  card). Rendered to PNG by tools/web-assets/generate.sh via headless Chrome.
  Edit here + re-run the generator; do not hand-edit the PNG.

  SLS-95/SLS-64: the card leads with a real hero catch frame (hero-frame.jpg —
  a crop of an in-browser neural-policy catch, HUD removed) with the title over
  the open sky. Swap hero-frame.jpg to refresh the shot; SLS-33's polished
  cinematic can replace it again later.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #eef3fb;
        overflow: hidden;
      }
      .bg {
        position: absolute; inset: 0;
        background: url('hero-frame.jpg') center/cover no-repeat;
      }
      /* Left-anchored scrim: darkens the sky for legible text and hides the
         faint HUD sliver in the frame's top-left corner. */
      .scrim {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, rgba(6,10,18,0.94) 0%, rgba(6,10,18,0.86) 30%, rgba(6,10,18,0.35) 55%, rgba(6,10,18,0) 72%),
          linear-gradient(0deg, rgba(6,10,18,0.55) 0%, rgba(6,10,18,0) 30%);
      }
      .content {
        position: absolute; inset: 0;
        padding: 62px 40px 54px 64px;
        display: flex; flex-direction: column; justify-content: space-between;
        width: 760px;
      }
      .kicker {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #86b6ef;
      }
      h1 { font-size: 62px; font-weight: 700; line-height: 1.02; letter-spacing: -0.5px; }
      h1 .accent { color: #ffffff; }
      .sub { font-size: 22px; line-height: 1.42; color: #c6d5ea; margin-top: 18px; max-width: 640px; }
      .foot {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 17px; color: #9fb2cc;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="scrim"></div>
    <div class="content">
      <div>
        <div class="kicker">Open-source · 6-DOF · in your browser</div>
        <h1>Catch the Super&nbsp;Heavy<br /><span class="accent">booster.</span></h1>
        <div class="sub">
          A from-scratch flight sim + controls test-bench — PID, convex MPC, and
          an imitation-learned neural policy, benchmarked head-to-head on the
          Mechazilla tower catch.
        </div>
      </div>
      <div class="foot">dionismuzenitov.github.io/starship-catch-sim</div>
    </div>
  </body>
</html>
