<!doctype html>
<!--
  Source template for apps/web/public/og-image.png (1200×630, the social-share
  card). Rendered to PNG by tools/web-assets/generate.sh via headless Chrome.
  Edit here + re-run the generator; do not hand-edit the PNG. The chart is the
  committed north-star progression figure (docs/media/progression.svg, SLS-72),
  referenced relative to this file. Temporary front-door art (SLS-95) — swap in
  hero art when SLS-64 lands.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        display: flex;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #eef3fb;
        background:
          radial-gradient(1100px 700px at 78% 18%, rgba(42,120,214,0.28), transparent 60%),
          linear-gradient(135deg, #0a0e16 0%, #0b1524 55%, #0a1220 100%);
        overflow: hidden;
      }
      .left {
        flex: 1 1 0;
        padding: 62px 40px 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .kicker {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7db0f0;
      }
      h1 { font-size: 60px; font-weight: 700; line-height: 1.02; letter-spacing: -0.5px; }
      .headline { font-size: 33px; font-weight: 650; color: #cfe0f7; margin-top: 20px; }
      .headline b { color: #ffffff; }
      .sub { font-size: 20px; line-height: 1.45; color: #9fb2cc; margin-top: 14px; max-width: 560px; }
      .foot {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 17px; color: #8aa0bd;
      }
      .right {
        flex: 0 0 560px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-right: 44px;
      }
      .right img {
        width: 520px;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div>
        <div class="kicker">Open-source · 6-DOF · in your browser</div>
        <h1>Starship&nbsp;Catch<br />Simulator</h1>
        <div class="headline">No single controller wins.</div>
        <div class="sub">
          PID → convex MPC → an imitation-learned neural policy, on one physics
          core — scored on a held-out, domain-randomized catch benchmark.
        </div>
      </div>
      <div class="foot">dionismuzenitov.github.io/starship-catch-sim</div>
    </div>
    <div class="right">
      <img src="../../docs/media/progression.svg" alt="Catch rate by controller generation" />
    </div>
  </body>
</html>
